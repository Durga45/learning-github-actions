name: CICD pipeline

on:
    push:

jobs:
    code:
      uses: ./.github/workflows/hello.yml

    build:
        needs: code
        uses: ./.github/workflows/build.yml

    test:
        needs: build
        uses: ./.github/workflows/test.yml

    deploy:
        needs: test
        uses: ./.github/workflows/deploy.yml